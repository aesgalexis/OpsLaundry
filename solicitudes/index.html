<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Solicitudes de máquinas | OpsLaundry</title><link rel="stylesheet" href="/ls_styles.css"><link rel="stylesheet" href="/submissions/submissions.css"><script src="/static/js/config/runtime-config.js"></script></head><body class="page ls-contact-page"><main class="page-shell submission-page"><a href="/es/maquinaria-ocasion/">← Maquinaria de ocasión</a><h1>Solicitudes de máquinas</h1><p id="access-status" role="status">Comprobando sesión…</p><button class="btn-pill" id="login" hidden>Iniciar sesión</button><section id="review-panel" hidden><label for="status-filter">Estado</label><select class="ls-filter-select" id="status-filter"><option value="pending">Pendientes</option><option value="approving">Publicación en curso / reintentar</option><option value="approved">Aprobadas</option><option value="rejected">Rechazadas</option></select><button class="btn-pill" id="refresh">Actualizar</button><p id="review-status" role="status"></p><div id="requests"></div><button class="btn-pill" id="more" hidden>Cargar más</button></section><template id="review-fields"><fieldset><legend>Datos de la máquina</legend><div class="form-grid">
<div class="form-field"><label for="categoria">Tipo</label><select class="field" id="categoria" name="categoria"><option value="Plegadora">Plegadora</option><option value="Lavadora">Lavadora</option><option value="Tunel">Túnel</option><option value="Secadora">Secadora</option><option value="Calandra">Calandra</option><option value="Prensa">Prensa</option><option value="Empaquetadora">Empaquetadora</option><option value="Otro">Otro</option></select></div>
<div class="form-field"><label for="marca">Marca</label><input class="field" id="marca" name="marca" type="text" required maxlength="160"></div>
<div class="form-field"><label for="modelo">Modelo</label><input class="field" id="modelo" name="modelo" type="text" maxlength="160"></div>
<div class="form-field"><label for="capacidad">Capacidad (kg)</label><input class="field" id="capacidad" name="capacidad" type="number" min="0" step="any"></div>
<div class="form-field"><label for="anio">Año</label><input class="field" id="anio" name="anio" type="number" min="1900" max="2100"></div>
<div class="form-field"><label for="estado">Estado</label><select class="field" id="estado" name="estado"><option value="Usada">Usada</option><option value="Bueno">Bueno</option><option value="Muy Bueno">Muy bueno</option><option value="Excelente">Excelente</option><option value="Repasada">Repasada</option></select></div>
<div class="form-field"><label for="ubicacion">Ubicación (ciudad y país)</label><input class="field" id="ubicacion" name="ubicacion" type="text" required maxlength="160"></div>
<div class="form-field"><label for="precio">Precio (EUR, sin impuestos)</label><input class="field" id="precio" name="precio" type="text" placeholder="17000 o Consultar"></div>
<div class="form-field"><label for="calefaccion">Calefacción</label><select class="field" id="calefaccion" name="calefaccion"><option value="">Sin especificar</option><option value="Gas">Gas</option><option value="Vapor">Vapor</option><option value="Aceite">Aceite</option></select></div>
<div class="form-field"><label for="garantiaTipo">Tipo de garantía</label><select class="field" id="garantiaTipo" name="garantiaTipo"><option value="">Sin garantía</option><option value="piezas">Piezas</option><option value="total">Total</option></select></div>
<div class="form-field"><label for="garantiaDetalle">Duración de garantía (meses)</label><select class="field" id="garantiaDetalle" name="garantiaDetalle"><option value="">Sin especificar</option><option value="3">3</option><option value="6">6</option><option value="12">12</option><option value="24">24</option><option value="36">36</option></select></div>
<div class="form-field form-field--full"><label><input type="checkbox" name="envioIncluido"> Envío incluido</label><label><input type="checkbox" name="puestaEnMarchaIncluida"> Puesta en marcha incluida</label></div>
<div class="form-field form-field--full"><label for="comentarios">Comentarios</label><textarea class="field" name="comentarios" id="comentarios" maxlength="3000" rows="5"></textarea></div>
</div></fieldset></template></main><script type="module" src="/submissions/review.js"></script></body></html>
