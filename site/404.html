<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <title>Redireccionando… | OpsLaundry</title>
  <script>
    const requestedPath = window.location.pathname.replace(/\/+$/, "");
    const machineryRoutes = {
      es: "maquinaria-ocasion",
      en: "used-machinery",
      it: "macchinari-usati",
      el: "metacheirismena-michanimata",
    };
    const match = requestedPath.match(/^\/(es|en|it|el)\/([^/]+)\/([A-Za-z0-9_-]+)$/);
    const isMachine = match && machineryRoutes[match[1]] === match[2];
    const target = new URL(isMachine ? `/${match[1]}/${match[2]}/` : "/es/", window.location.origin);
    if (isMachine) target.searchParams.set("machine", match[3]);
    window.location.replace(target.toString());
  </script>
</head>
<body><p>Redireccionando…</p></body>
</html>
