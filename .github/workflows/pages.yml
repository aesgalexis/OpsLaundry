name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  functions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci --prefix firebase/functions
      - run: npm run test:functions

  build:
    needs: functions-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Create runtime config
        run: |
          cat <<'EOF' > .env.local
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID=${{ secrets.FIREBASE_MEASUREMENT_ID }}
          FIREBASE_APP_CHECK_SITE_KEY=${{ secrets.FIREBASE_APP_CHECK_SITE_KEY }}
          EOF

      - name: Install
        run: npm ci

      - name: Verify source
        run: |
          npm run check:css
          npm run test:site
          npm run lint:links
          npm run scan:secrets

      - name: Restore public machinery snapshot
        uses: actions/cache/restore@v5
        with:
          path: .cache/machinery-snapshot.json
          key: public-machinery-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: public-machinery-v2-

      - name: Build
        run: npm run build:with-stats

      - name: Verify publishable artifact
        run: npm run check:publish

      - name: Save public machinery snapshot
        uses: actions/cache/save@v5
        with:
          path: .cache/machinery-snapshot.json
          key: public-machinery-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
